[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "incus-mcp"
version = "0.1.0"
description = "MCP server (Streamable HTTP) that drives a single, restricted Incus project"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
incus-mcp = "incus_mcp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
